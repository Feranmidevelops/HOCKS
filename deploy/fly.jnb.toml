# The near region: Johannesburg — closest Fly region to Lagos.
# Deploy from the repo root:
#   fly apps create hocks-jnb
#   fly deploy --config deploy/fly.jnb.toml
app = "hocks-jnb"
primary_region = "jnb"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
