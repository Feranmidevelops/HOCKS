# The deliberately far region: Los Angeles — most of the planet away from
# Lagos. Same game, same code; only the speed of light differs.
#   fly apps create hocks-lax
#   fly deploy --config deploy/fly.lax.toml
app = "hocks-lax"
primary_region = "lax"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
